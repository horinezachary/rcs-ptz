<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { height: 100%; overflow: hidden; }
      main { height: 100%; display: flex; flex-direction: column; padding: 12px 20px 14px; gap: 10px; box-sizing: border-box; }
      header { display: flex; align-items: center; gap: 14px; min-height: 48px; }
      h1 { margin: 0; font-size: 26px; font-weight: 700; white-space: nowrap; }
      .note { margin: 0; color: var(--rcs-muted); font-size: 14px; line-height: 1.45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
      .grow { flex: 1; min-width: 0; }
      .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
      .empty p { margin: 0; color: var(--rcs-muted); font-size: 17px; max-width: 900px; line-height: 1.5; }
      .label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--rcs-muted); }
      .ok { --sev: var(--rcs-ok); } .warning { --sev: var(--rcs-warn); } .critical { --sev: var(--rcs-error); } .unknown { --sev: var(--rcs-muted); }
      .pill { height: 30px; padding: 0 12px; border-radius: 15px; font: 700 13.5px var(--rcs-font); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; max-width: 520px; overflow: hidden;
        color: var(--sev); background: color-mix(in srgb, var(--sev) 12%, transparent); border: 1px solid color-mix(in srgb, var(--sev) 40%, transparent); }
      .dot { display: inline-block; width: 9px; height: 9px; border-radius: 5px; background: var(--sev); flex: none; }
      .seg { display: flex; border: 1px solid var(--rcs-border); border-radius: 10px; overflow: hidden; flex: none; }
      .seg button { height: 44px; padding: 0 14px; font: 700 13px var(--rcs-font); letter-spacing: 0.04em; background: var(--rcs-surface); color: var(--rcs-muted); border: 0; cursor: pointer; white-space: nowrap; }
      .seg button + button { border-left: 1px solid var(--rcs-border); }
      .seg button.on { background: var(--rcs-accent); color: #fff; }
      .seg button:disabled { opacity: 0.4; }
      .btn { height: 44px; padding: 0 16px; border-radius: 10px; font: 700 14px var(--rcs-font); letter-spacing: 0.04em; cursor: pointer; border: 1px solid var(--rcs-border);
        background: var(--rcs-surface); color: var(--rcs-text); white-space: nowrap; }
      .btn:disabled { opacity: 0.4; cursor: default; }
      .btn.armed { background: #3A2A0E; border-color: var(--rcs-accent); color: #FFE2B0; }

      /* cameras */
      .cams { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 300px; gap: 14px; }
      .grid { display: grid; gap: 10px; align-content: center; justify-content: center; min-height: 0; }
      .tile { position: relative; background: #050607; border: 2px solid var(--rcs-border); border-radius: 10px; overflow: hidden; cursor: pointer; aspect-ratio: 16 / 9; }
      .tile.sel { border-color: var(--rcs-accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--rcs-accent) 45%, transparent); }
      .tile.moving { border-color: #4C8DFF; }
      .tile video.cam-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
      .tile .ov { position: absolute; left: 0; right: 0; display: flex; align-items: center; gap: 8px; padding: 6px 10px; font: 700 14px var(--rcs-font); color: #fff; pointer-events: none; }
      .tile .top { top: 0; background: linear-gradient(rgba(0,0,0,0.65), transparent); }
      .tile .bot { bottom: 0; background: linear-gradient(transparent, rgba(0,0,0,0.7)); font: 600 12px var(--rcs-mono); color: #ddd; }
      .tile .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
      .tag { font: 800 10.5px var(--rcs-font); letter-spacing: 0.08em; padding: 2px 6px; border-radius: 5px; background: rgba(0,0,0,0.55); border: 1px solid currentColor; white-space: nowrap; }
      .tag.sel { color: var(--rcs-accent); } .tag.live { color: #46c46e; } .tag.off { color: #ff8a80; }
      .tile .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 16px; color: #8a8f98; font-size: 13px; line-height: 1.4; }
      .side { border: 1px solid var(--rcs-border); border-radius: 14px; background: var(--rcs-surface); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow: hidden; }
      .side .n { font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .kv { display: grid; grid-template-columns: 72px 1fr; gap: 3px 10px; font-size: 13.5px; align-items: baseline; }
      .kv .k { color: var(--rcs-muted); font-size: 12px; }
      .kv .v { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--rcs-mono); }
      .bar { height: 6px; border-radius: 3px; background: var(--rcs-border); overflow: hidden; }
      .bar i { display: block; height: 100%; background: var(--rcs-accent); }
      .row { display: flex; gap: 8px; align-items: center; }

      /* picture */
      .pic { flex: 1; min-height: 0; columns: 220px 5; column-gap: 28px; column-fill: auto; column-rule: 1px solid var(--rcs-border); }
      .pic > * { break-inside: avoid; margin-bottom: 10px; }
      .pic .gh { display: block; break-after: avoid; margin-bottom: 6px; color: var(--rcs-accent); }
      .pic .gh:not(:first-child) { margin-top: 6px; }
      .group { border: 1px solid var(--rcs-border); border-radius: 14px; background: var(--rcs-surface); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow: hidden; }
      .p { display: flex; flex-direction: column; gap: 4px; }
      .p.off { opacity: 0.45; }
      .p .pl { font-size: 12.5px; color: var(--rcs-muted); display: flex; justify-content: space-between; gap: 8px; }
      .p .pl b { color: var(--rcs-text); font: 700 14px var(--rcs-mono); white-space: nowrap; }
      .stepper { display: grid; grid-template-columns: 50px 1fr 50px; gap: 6px; align-items: center; }
      .stepper .bar { height: 8px; }
      .stepper button, .opt button { height: 38px; border-radius: 9px; border: 1px solid var(--rcs-border); background: var(--rcs-bg); color: var(--rcs-text); font: 800 18px var(--rcs-font); cursor: pointer; }
      .opt { display: flex; gap: 4px; flex-wrap: wrap; }
      .opt button { font: 700 12.5px var(--rcs-font); padding: 0 9px; height: 36px; }
      .opt button.on { background: var(--rcs-accent); border-color: var(--rcs-accent); color: #fff; }
      .act { height: 38px; border-radius: 9px; border: 1px solid var(--rcs-border); background: var(--rcs-bg); color: var(--rcs-text); font: 700 13px var(--rcs-font); cursor: pointer; }
      .hint { font-size: 11px; color: var(--rcs-muted); font-weight: 400; flex: 1; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      button:disabled { cursor: default; }

      /* presets */
      .presets { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .pre { border: 1px solid var(--rcs-border); border-radius: 12px; background: var(--rcs-surface); color: var(--rcs-text); font: inherit; text-align: left; padding: 10px 12px;
        display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; min-width: 0; overflow: hidden; }
      .pre .n { font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .pre .t { font: 700 11px var(--rcs-font); letter-spacing: 0.08em; color: var(--rcs-muted); }
      .pre.store { background: #3A2A0E; border-color: var(--rcs-accent); color: #FFE2B0; }

      /* setup */
      .setup { flex: 1; min-height: 0; display: grid; grid-template-columns: 430px 1fr 470px; gap: 20px; }
      .col { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
      .toggle { display: flex; align-items: center; gap: 14px; font-size: 15px; }
      .list { border: 1px solid var(--rcs-border); border-radius: 12px; background: var(--rcs-surface); overflow: hidden; }
      .item { display: flex; align-items: center; gap: 12px; padding: 7px 12px; border-bottom: 1px solid var(--rcs-border); min-height: 46px; box-sizing: border-box; }
      .item:last-child { border-bottom: 0; }
      .item .t { flex: 1; min-width: 0; }
      .item .n { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .item .d { font: 12.5px var(--rcs-mono); color: var(--rcs-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .brands { display: flex; gap: 6px; flex-wrap: wrap; }
      .brands button { height: 38px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--rcs-border); background: var(--rcs-surface); color: var(--rcs-text); font: 600 13.5px var(--rcs-font); cursor: pointer; }
      .brands button.on { border-color: var(--rcs-accent); color: var(--rcs-accent); }

      .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #3A2A0E; border: 2px solid var(--rcs-accent); color: #FFE2B0;
        padding: 10px 20px; border-radius: 12px; font-size: 17px; font-weight: 600; white-space: nowrap; z-index: 50; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 id="title">Cameras</h1>
        <span class="pill" id="state"><span class="dot"></span><span id="stateText"></span></span>
        <span class="note grow" id="sub"></span>
        <div class="seg" id="camTabs" role="group" aria-label="Camera"></div>
        <div class="seg" id="speed" role="group" aria-label="Speed">
          <button data-v="slow">SLOW</button><button data-v="medium">MED</button><button data-v="fast">FAST</button>
        </div>
        <div class="seg" id="keyMode" role="group" aria-label="Stream Deck keys">
          <button data-v="ptz">PTZ KEYS</button><button data-v="presets">PRESETS</button><button data-v="picture">PICTURE</button>
        </div>
      </header>

      <div class="empty" id="empty" hidden>
        <p>No camera yet. Add one by its address in Setup, or scan the network. The module only reads from cameras until you turn on Allow controls.</p>
        <rcs-button id="emptySetup" variant="primary">Open Setup</rcs-button>
      </div>

      <section id="view-cameras" class="cams" hidden>
        <div class="grid" id="grid"></div>
        <aside class="side" id="side"></aside>
      </section>

      <section id="view-picture" class="pic" hidden></section>

      <section id="view-presets" class="col" hidden>
        <div class="row">
          <span class="note grow" id="presetNote"></span>
          <button class="btn" id="home">HOME</button>
          <button class="btn" id="store">STORE</button>
        </div>
        <div class="presets" id="presetGrid"></div>
      </section>

      <section id="view-setup" class="setup" hidden>
        <div class="col">
          <span class="label">ADD A CAMERA</span>
          <div class="brands" id="brands"></div>
          <rcs-field id="address" label="IP address" kind="ip" placeholder="192.168.0.20"></rcs-field>
          <div class="row"><button class="btn" id="scan">SCAN NETWORK</button><span class="note grow" id="scanNote"></span></div>
          <span class="note" style="white-space: normal">Ports, stream addresses, logins and preset names are in the web view's Setup.</span>
        </div>
        <div class="col">
          <span class="label" id="listHead">CAMERAS</span>
          <div class="list" id="camList"></div>
        </div>
        <div class="col">
          <span class="label">SETTINGS</span>
          <label class="toggle"><rcs-toggle id="allowControls" label="Allow controls"></rcs-toggle>Allow controls: move cameras and change their picture</label>
          <div class="row"><span class="note">Live video here:</span>
            <div class="seg" id="liveVideo"><button data-v="all">ALL</button><button data-v="selected">SELECTED</button><button data-v="off">OFF</button></div>
          </div>
          <label class="toggle"><rcs-toggle id="bridge" label="ONVIF bridge"></rcs-toggle>RTMP to ONVIF bridge: each camera as an ONVIF camera with RTSP and PTZ</label>
          <span class="note" id="bridgeNote" style="white-space: normal"></span>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" hidden></div>

    <rcs-dialog id="confirm">
      <span id="confirmText"></span>
      <div slot="buttons">
        <rcs-button id="no">Cancel</rcs-button>
        <rcs-button id="yes" variant="danger">OK</rcs-button>
      </div>
    </rcs-dialog>

    <script src="video.js"></script>
    <script type="module">
      const $ = (id) => document.getElementById(id);
      const TITLES = { cameras: 'Cameras', picture: 'Picture', presets: 'Presets', setup: 'Setup' };
      const GROUPS = [['exposure', 'EXPOSURE'], ['color', 'COLOUR'], ['focus', 'FOCUS'], ['image', 'IMAGE']];
      let s = null;
      let brand = 'sony';
      let onYes = null;
      const video = createVideo(rcs);
      const tiles = new Map();

      function el(tag, attrs = {}, text) {
        const e = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (v === true) e.setAttribute(k, '');
          else if (v !== false && v != null) e.setAttribute(k, String(v));
        }
        if (text != null) e.textContent = text;
        return e;
      }
      function ask(text, ok, fn) {
        $('confirmText').textContent = text;
        $('yes').textContent = ok;
        onYes = fn;
        $('confirm').show();
      }
      $('no').onclick = () => { $('confirm').close(); if (s) { $('allowControls').checked = s.allowControls; $('bridge').checked = s.bridge.enabled; } };
      $('yes').onclick = () => { $('confirm').close(); onYes?.(); };
      const cur = () => s?.cameras.find((c) => c.id === s.current);
      const entry = (id) => s?.entries.find((e) => e.id === id);
      const fmt = (n, d = 0) => (n == null ? '–' : Number(n).toFixed(d));

      function draw() {
        if (!s) return;
        const v = s.view;
        const none = !s.entries.length && v !== 'setup';
        const c = cur();
        $('title').textContent = TITLES[v];
        const st = !c ? 'unknown' : c.reachable ? 'ok' : c.read ? 'critical' : 'unknown';
        $('state').className = 'pill ' + st;
        $('stateText').textContent = !c ? 'No camera' : c.reachable ? `${c.name} · ${c.identity?.model || c.protocol}` : c.lastError ? `${c.name} · ${c.lastError}` : `${c.name} · connecting`;
        $('sub').textContent = !s.allowControls ? 'View only: turn on Allow controls in Setup' : v === 'cameras' ? 'Tap a camera to drive it from the keys' : '';
        $('empty').hidden = !none;
        for (const x of ['cameras', 'picture', 'presets', 'setup']) $('view-' + x).hidden = none || v !== x;
        $('speed').hidden = v === 'setup' || none;
        $('keyMode').hidden = v === 'setup' || none;
        for (const b of $('speed').children) b.classList.toggle('on', b.dataset.v === s.speed);
        for (const b of $('keyMode').children) b.classList.toggle('on', b.dataset.v === s.keyMode);
        drawTabs();
        if (!none) ({ cameras: drawCameras, picture: drawPicture, presets: drawPresets, setup: drawSetup })[v]();
        // Which pictures this panel shows (the Pi decodes each one): Setup decides.
        const shown = v === 'cameras' && !none ? (s.liveVideo === 'all' ? s.cameras.map((x) => x.id) : s.liveVideo === 'selected' && c ? [c.id] : []) : [];
        video.want(shown);
        const t = $('toast');
        t.hidden = !s.storeArmed;
        if (s.storeArmed) t.textContent = 'Tap a preset (or press a preset key) to store the camera’s position there';
      }

      function drawTabs() {
        const box = $('camTabs');
        box.replaceChildren();
        box.hidden = s.view === 'cameras' || s.view === 'setup' || s.cameras.length < 2;
        for (const x of s.cameras) {
          const b = el('button', { class: x.id === s.current ? 'on' : '' }, x.name);
          b.onclick = () => rcs.send({ type: 'select', id: x.id });
          box.append(b);
        }
      }

      /** Rows and columns that make the 16:9 tiles as big as the box allows. */
      function layout(n, W, H) {
        let best = { cols: 1, rows: 1, w: 0 };
        for (let rows = 1; rows <= n; rows++) {
          const cols = Math.ceil(n / rows);
          const w = Math.min((W - 10 * (cols - 1)) / cols, ((H - 10 * (rows - 1)) / rows) * (16 / 9));
          if (w > best.w) best = { cols, rows, w };
        }
        return best;
      }

      function tileFor(cam) {
        let t = tiles.get(cam.id);
        if (t) return t;
        const root = el('div', { class: 'tile' });
        const msg = el('div', { class: 'msg' });
        const top = el('div', { class: 'ov top' });
        const bot = el('div', { class: 'ov bot' });
        root.append(msg, top, bot);
        root.onclick = () => rcs.send({ type: 'select', id: cam.id });
        t = { root, msg, top, bot, vid: null };
        tiles.set(cam.id, t);
        return t;
      }

      function drawCameras() {
        const grid = $('grid');
        const list = s.cameras;
        for (const id of [...tiles.keys()]) if (!list.some((c) => c.id === id)) { tiles.get(id).root.remove(); tiles.delete(id); }
        const box = grid.getBoundingClientRect();
        const L = layout(Math.max(1, list.length), box.width || 1500, box.height || 360);
        grid.style.gridTemplateColumns = `repeat(${L.cols}, ${Math.floor(L.w)}px)`;
        const want = s.liveVideo === 'all' ? list.map((c) => c.id) : s.liveVideo === 'selected' ? [s.current] : [];
        list.forEach((c, i) => {
          const t = tileFor(c);
          if (grid.children[i] !== t.root) grid.insertBefore(t.root, grid.children[i] ?? null);
          const mo = c.motion || {};
          t.root.className = 'tile' + (c.id === s.current ? ' sel' : '') + (mo.pan || mo.tilt || mo.zoom || mo.focus ? ' moving' : '');
          const showVideo = want.includes(c.id) && c.stream.live;
          if (showVideo && !t.vid) { t.vid = video.element(c.id); t.root.prepend(t.vid); }
          if (!showVideo && t.vid) { t.vid.remove(); t.vid = null; }
          t.msg.textContent = showVideo ? '' : !want.includes(c.id) ? 'Live video is off on this panel (Setup)' : c.videoMode === 'none' ? 'No video set up' : c.stream.codec ? `${c.stream.codec}: only H.264 can be shown` : c.stream.error || (c.videoMode === 'push' ? 'Waiting for the camera to push RTMP' : 'Connecting to the stream…');
          t.top.replaceChildren(el('span', { class: 'dot ' + (c.reachable ? 'ok' : 'critical'), style: `--sev: var(--rcs-${c.reachable ? 'ok' : 'error'})` }), el('span', { class: 'nm' }, c.name));
          if (c.id === s.current) t.top.append(el('span', { class: 'tag sel' }, 'SELECTED'));
          t.top.append(el('span', { class: 'tag ' + (c.stream.live ? 'live' : 'off') }, c.stream.live ? `${c.stream.height}p${c.stream.fps}` : 'NO VIDEO'));
          const z = c.status?.zoom;
          t.bot.textContent = c.reachable ? `${c.identity?.model || ''}${z != null ? ` · zoom ${Math.round(z * 100)}%` : ''}${c.status?.focusAuto != null ? (c.status.focusAuto ? ' · AF' : ' · MF') : ''}` : c.lastError || 'connecting';
        });
        drawSide();
      }

      function drawSide() {
        const c = cur();
        const side = $('side');
        side.replaceChildren();
        if (!c) return;
        const e = entry(c.id);
        side.append(el('span', { class: 'label' }, 'SELECTED CAMERA'), el('div', { class: 'n' }, c.name));
        const kv = el('div', { class: 'kv' });
        const add = (k, v) => kv.append(el('span', { class: 'k' }, k), el('span', { class: 'v' }, v));
        add('Camera', `${c.identity?.vendor || s.brands[c.brand]?.label || ''} ${c.identity?.model || ''}`.trim() || '–');
        add('Control', `${s.protocols[c.protocol].label}`);
        add('Address', `${c.host}:${c.port}`);
        add('Pan / tilt', c.status?.pan != null ? `${fmt(c.status.pan, c.protocol === 'onvif' ? 2 : 0)} / ${fmt(c.status.tilt, c.protocol === 'onvif' ? 2 : 0)}` : '–');
        add('Video', c.stream.live ? `${c.stream.width}×${c.stream.height} ${c.stream.fps} fps ${c.stream.kbps} kb/s` : e?.video.mode === 'none' ? 'none' : 'no picture');
        side.append(kv);
        if (c.status?.zoom != null) {
          const bar = el('div', { class: 'bar' });
          bar.append(el('i', { style: `width: ${Math.round(c.status.zoom * 100)}%` }));
          side.append(el('span', { class: 'label' }, `ZOOM ${Math.round(c.status.zoom * 100)}%`), bar);
        }
        const row = el('div', { class: 'row' });
        const live = s.allowControls && c.reachable;
        const home = el('button', { class: 'btn', disabled: !live }, 'HOME');
        home.onclick = () => rcs.send({ type: 'home', id: c.id });
        const af = el('button', { class: 'btn', disabled: !live || c.status?.focusAuto == null }, c.status?.focusAuto ? 'AF ON' : 'AF OFF');
        af.onclick = () => rcs.send({ type: 'set', id: c.id, param: 'focus', value: c.status?.focusAuto ? 'manual' : 'auto' });
        row.append(home, af);
        side.append(row);
      }

      function paramRow(c, p) {
        const live = s.allowControls && c.reachable && p.enabled !== false;
        const d = el('div', { class: 'p' + (p.enabled === false ? ' off' : '') });
        const pl = el('div', { class: 'pl' });
        pl.append(el('span', {}, p.label));
        if (p.hint && p.enabled === false) pl.append(el('span', { class: 'hint' }, p.hint));
        pl.append(el('b', {}, p.kind === 'action' ? '' : p.text ?? String(p.value)));
        d.append(pl);
        if (p.kind === 'range') {
          const st = el('div', { class: 'stepper' });
          const minus = el('button', { disabled: !live }, '−');
          const plus = el('button', { disabled: !live }, '+');
          minus.onclick = () => rcs.send({ type: 'step', id: c.id, param: p.id, dir: -1 });
          plus.onclick = () => rcs.send({ type: 'step', id: c.id, param: p.id, dir: 1 });
          const bar = el('div', { class: 'bar' });
          bar.append(el('i', { style: `width: ${Math.round(((p.value - p.min) / (p.max - p.min || 1)) * 100)}%` }));
          st.append(minus, bar, plus);
          d.append(st);
        } else if (p.kind === 'enum') {
          const o = el('div', { class: 'opt' });
          const opts = p.options.length > 6 ? p.options.filter((x, i) => x.value === p.value || i % Math.ceil(p.options.length / 6) === 0) : p.options;
          for (const x of opts) {
            const b = el('button', { class: x.value === p.value ? 'on' : '', disabled: !live }, x.label);
            b.onclick = () => rcs.send({ type: 'set', id: c.id, param: p.id, value: x.value });
            o.append(b);
          }
          d.append(o);
        } else {
          const b = el('button', { class: 'act', disabled: !live }, p.label);
          b.onclick = () => rcs.send({ type: 'set', id: c.id, param: p.id, value: 1 });
          d.replaceChildren(b);
          if (p.hint && p.enabled === false) d.append(el('span', { class: 'hint', style: 'text-align: left' }, p.hint));
        }
        return d;
      }

      function drawPicture() {
        const box = $('view-picture');
        box.replaceChildren();
        const c = cur();
        if (!c) return;
        if (!c.picture.length) {
          box.append(el('div', { class: 'note' }, c.reachable ? 'Reading the camera’s picture settings…' : `${c.name} is not answering`));
          return;
        }
        for (const [g, label] of GROUPS) {
          const ps = c.picture.filter((p) => p.group === g);
          if (!ps.length) continue;
          box.append(el('span', { class: 'label gh' }, label));
          for (const p of ps) box.append(paramRow(c, p));
        }
      }

      function drawPresets() {
        const c = cur();
        const e = c && entry(c.id);
        const live = s.allowControls && c?.reachable;
        $('presetNote').textContent = !c ? '' : s.storeArmed ? 'Tap the preset to store the camera’s position in' : `${c.name}: tap to recall. Names are set in the web view.`;
        $('home').disabled = !live;
        $('store').disabled = !live;
        $('store').classList.toggle('armed', s.storeArmed);
        const g = $('presetGrid');
        g.replaceChildren();
        for (let n = 1; n <= 16; n++) {
          const name = e?.presetNames[n - 1];
          const b = el('button', { class: 'pre' + (s.storeArmed ? ' store' : '') });
          b.append(el('span', { class: 'n' }, name || `Preset ${n}`), el('span', { class: 't' }, s.storeArmed ? 'STORE HERE' : `PRESET ${n}${n <= 12 ? ` · KEY ${n}` : ''}`));
          b.disabled = !live;
          b.onclick = () => rcs.send({ type: s.storeArmed ? 'store' : 'recall', id: c.id, n });
          g.append(b);
        }
      }

      function drawSetup() {
        $('allowControls').checked = s.allowControls;
        $('bridge').checked = s.bridge.enabled;
        for (const b of $('liveVideo').children) b.classList.toggle('on', b.dataset.v === s.liveVideo);
        const bs = $('brands');
        bs.replaceChildren();
        for (const [k, v] of Object.entries(s.brands)) {
          const b = el('button', { class: k === brand ? 'on' : '' }, v.label.replace('Other VISCA camera', 'VISCA').replace('ONVIF camera', 'ONVIF'));
          b.onclick = () => { brand = k; drawSetup(); };
          bs.append(b);
        }
        $('scan').disabled = s.scan?.running;
        $('scanNote').textContent = s.scan?.running ? 'Scanning…' : s.scan?.at ? `${s.scan.found.length} found` : '';
        $('listHead').textContent = `CAMERAS · ${s.entries.length} of 16`;
        const list = $('camList');
        list.replaceChildren();
        if (!s.entries.length && !s.scan?.found.length) list.append(el('div', { class: 'item' }, 'None yet'));
        for (const e of s.entries) {
          const c = s.cameras.find((x) => x.id === e.id);
          const row = el('div', { class: 'item ' + (c?.reachable ? 'ok' : 'critical') });
          const t = el('div', { class: 't' });
          const vid = e.video.mode === 'push' ? (c?.stream.live ? 'RTMP in' : 'waiting for RTMP') : e.video.mode === 'pull' ? 'RTMP pull' : 'no video';
          t.append(el('div', { class: 'n' }, e.name), el('div', { class: 'd' }, `${s.brands[e.brand].label} · ${e.host} · ${vid}${c && !c.reachable && c.lastError ? ' · ' + c.lastError : ''}`));
          const rm = el('rcs-button', { size: 'small', variant: 'danger' }, 'Remove');
          rm.onclick = () => ask(`Remove ${e.name} from this module? Nothing changes on the camera.`, 'Remove', () => rcs.send({ type: 'remove', id: e.id }));
          row.append(el('span', { class: 'dot' }), t, rm);
          list.append(row);
        }
        for (const f of s.scan?.found ?? []) {
          if (f.added) continue;
          const row = el('div', { class: 'item' });
          const t = el('div', { class: 't' });
          t.append(el('div', { class: 'n' }, `Found: ${f.name || f.model || f.host}`), el('div', { class: 'd' }, `${s.brands[f.brand].label} · ${f.host} · ${f.via.join(', ')}`));
          const add = el('rcs-button', { size: 'small', variant: 'primary' }, 'Add');
          add.onclick = () => rcs.send({ type: 'add-found', host: f.host });
          row.append(t, add);
          list.append(row);
        }
        const ip = s.unit[0] || '<unit>';
        $('bridgeNote').textContent = s.bridge.enabled
          ? (s.bridge.errors.length ? s.bridge.errors.join('; ') : `ONVIF cameras on ${ip}, ports ${s.bridge.basePort}–${s.bridge.basePort + Math.max(0, s.entries.length - 1)}; RTSP on ${s.bridge.rtspPort}. PTZ from ONVIF clients needs Allow controls.`)
          : `Off. Cameras push RTMP to rtmp://${ip}:${s.rtmp.port || 1935}/live/<stream key> (keys in the web view).`;
      }

      $('emptySetup').onclick = () => rcs.send({ type: 'view', view: 'setup' });
      for (const b of $('speed').children) b.onclick = () => rcs.send({ type: 'speed', speed: b.dataset.v });
      for (const b of $('keyMode').children) b.onclick = () => rcs.send({ type: 'key-mode', mode: b.dataset.v });
      for (const b of $('liveVideo').children) b.onclick = () => rcs.send({ type: 'live-video', mode: b.dataset.v });
      $('home').onclick = () => rcs.send({ type: 'home' });
      $('store').onclick = () => rcs.send({ type: 'arm-store' });
      $('scan').onclick = () => rcs.send({ type: 'scan', target: '' });
      $('address').addEventListener('change', (e) => {
        if (e.detail) rcs.send({ type: 'add', host: e.detail, brand, video: { mode: 'push' } });
        $('address').setAttribute('value', '');
      });
      $('allowControls').addEventListener('change', (e) =>
        e.detail
          ? ask('Allow commands to the cameras? The keys and this screen can then move cameras, recall and store presets and change their picture.', 'Allow', () => rcs.send({ type: 'allow', on: true }))
          : rcs.send({ type: 'allow', on: false })
      );
      $('bridge').addEventListener('change', (e) =>
        e.detail
          ? ask('Turn on the ONVIF bridge? Each camera appears on the network as an ONVIF camera with an RTSP stream; ONVIF clients can move it while Allow controls is on.', 'Turn on', () => rcs.send({ type: 'bridge', enabled: true }))
          : rcs.send({ type: 'bridge', enabled: false })
      );
      window.addEventListener('resize', draw);

      await rcs.ready();
      rcs.on('message', (m) => {
        if (m?.type === 'snapshot') {
          s = m;
          draw();
        } else video.onMessage(m);
      });
      rcs.send({ type: 'hello' });
    </script>
  </body>
</html>
